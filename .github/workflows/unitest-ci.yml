name: Unittest CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "main" ]
jobs:
  auto-unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set Python Version ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Requirements And Test-only Package
        run: |
          pip install -r install/requirements.txt
          pip install coverage

      # 便于测试代码导入config.config
      - name: Rename config.template.py To config.py
        run: cp config/config.template.py config/config.py
      
      - name: Prepare Necessary Files And Directories
        run: |
          mkdir -p logs
          mkdir -p archivedata
          echo "INFO: Test log content" > logs/refreshMetadata.log
          touch recordsRefreshed.db
          sqlite3 recordsRefreshed.db "CREATE TABLE IF NOT EXISTS test (id INTEGER PRIMARY KEY, message TEXT);"          
      
      - name: Run Unittest
        # 强制返回 0 避免流水线中断
        run: |
          python run_unit_tests.py  
        continue-on-error: true

      - name: Web And Integration Regression
        run: python -m unittest tests.test_web_backend tests.test_runtime_service tests.test_translation_task tests.test_integration_http tests.test_correction_task tests.test_ai_completion tests.test_media_policy tests.test_task_controls tests.test_login_background tests.test_task_lock_policy

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          name: python${{ matrix.python-version }}-test-results
          path: test_results/
