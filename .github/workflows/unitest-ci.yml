name: Unittest CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "main" ]
jobs:
  auto-unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set Up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test And Build Native Core
        run: |
          go test ./...
          CGO_ENABLED=0 go build -trimpath -o bin/bangumikomga-core ./cmd/bangumikomga-core

      - name: Set Python Version ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Requirements And Test-only Package
        run: |
          pip install -r install/requirements.txt
          pip install coverage

      # 便于测试代码导入config.config
      - name: Rename config.template.py To config.py
        run: cp config/config.template.py config/config.py
      
      - name: Prepare Necessary Files And Directories
        run: |
          mkdir -p logs
          mkdir -p archivedata
          echo "INFO: Test log content" > logs/refreshMetadata.log
          touch recordsRefreshed.db
          sqlite3 recordsRefreshed.db "CREATE TABLE IF NOT EXISTS test (id INTEGER PRIMARY KEY, message TEXT);"          
      
      - name: Run Unittest
        # 强制返回 0 避免流水线中断
        run: |
          python run_unit_tests.py  
        continue-on-error: true

      - name: Web And Integration Regression
        run: python -m unittest tests.test_web_backend tests.test_runtime_service tests.test_translation_task tests.test_integration_http tests.test_correction_task tests.test_ai_completion tests.test_media_policy tests.test_task_controls tests.test_login_background tests.test_task_lock_policy tests.test_activity_details tests.test_proxy_settings tests.test_login_cover_http tests.test_match_activity

      - name: Native Core And Archive Compatibility
        run: python -m unittest tests.test_native_core tests.test_archive_sqlite tests.test_komga_sse_api tests.test_provider_source tests.test_komf_matching tests.test_komf_bangumi_metadata tests.test_provider_books tests.test_tools_resort_search_results_list

      - name: Workbench Matching And Poster Regression
        run: python -m unittest tests.test_workbench_match tests.test_workbench tests.test_posters tests.test_record_comparison

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          name: python${{ matrix.python-version }}-test-results
          path: test_results/
