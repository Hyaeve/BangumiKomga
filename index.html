<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BangumiKomga · 控制台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="overrides.css">
</head>
<body>
  <div id="app" v-cloak>
    <section v-if="!authenticated" class="login-screen">
      <div class="login-orbit orbit-a"></div><div class="login-orbit orbit-b"></div>
      <form class="login-card" @submit.prevent="login">
        <h1>BangumiKomga</h1><p>管理媒体库刮削与运行策略</p>
        <label>账号<input v-model.trim="loginForm.username" autocomplete="username" autofocus></label>
        <label>密码<input v-model="loginForm.password" type="password" autocomplete="current-password"></label>
        <button class="primary login-button" type="submit">进入后台 <span>→</span></button>
      </form>
    </section>

    <template v-else>
      <aside class="sidebar" :class="{collapsed:sidebarCollapsed}">
        <div class="brand"><span class="brand-mark">BK</span><span class="brand-name">BangumiKomga</span></div>
        <button class="collapse-btn" @click="sidebarCollapsed=!sidebarCollapsed" :aria-label="sidebarCollapsed?'展开侧栏':'收起侧栏'"><span aria-hidden="true"></span></button>
        <nav class="nav"><button v-for="item in navItems" :key="item.id" class="nav-item" :class="{active:view===item.id}" @click="view=item.id"><span class="nav-icon">{{item.icon}}</span><span class="nav-label">{{item.label}}</span></button></nav>
        <div class="sidebar-foot"><span class="dot"></span><span class="nav-label">服务在线</span><button class="sidebar-logout" @click="logout" title="退出登录" aria-label="退出登录">↪</button></div>
      </aside>

      <main class="main" :class="{expanded:sidebarCollapsed}" @click="closeContextMenu">
        <header class="page-head hero-head"><div><p class="kicker">BANGUMI KOMGA</p><h1>{{currentNav.title}}</h1><p class="subtitle">{{currentNav.subtitle}}</p></div><div class="hero-status"><span class="status-pill">检查时间：{{new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}}</span><span class="status-pill online"><i></i> 已连接</span></div></header>

        <section v-if="view==='scrape'" class="view-stack">
          <div class="toolbar"><div></div><div class="toolbar-actions"><button class="secondary" @click="save">保存卡片</button><button class="primary" @click="addCard">＋ 添加媒体库</button></div></div>
          <div class="library-grid" @click="closeContextMenu">
            <article v-for="(card,index) in cards" :key="card.uid" class="library-card" :class="{dragging:dragIndex===index}" draggable="true" :style="{'--card-hue':card.hue}" @click="openCardSettings(card)" @dragstart="dragStart(index,$event)" @dragend="dragIndex=null" @dragover.prevent @drop="dropCard(index)" @contextmenu.prevent="openCardMenu(index,$event)">
              <div class="card-content"><p class="card-label">MEDIA LIBRARY {{String(index+1).padStart(2,'0')}}</p><h3>{{card.name||'选择媒体库'}}</h3><span class="tag">{{card.isNovel?'小说':'漫画'}}</span></div>
            </article>
            <button v-if="!cards.length" class="empty-card" @click="addCard"><span>＋</span><strong>添加第一个媒体库</strong><small>从 Komga 读取可用库</small></button>
          </div>
          <div v-if="contextMenu.visible" class="context-menu" :style="{left:contextMenu.x+'px',top:contextMenu.y+'px'}" @click.stop><button :disabled="status.running" @click="refresh(false);closeContextMenu()">增量刮削</button><button :disabled="status.running" @click="refresh(true);closeContextMenu()">全量刮削</button><button class="danger" @click="deleteCard(contextMenu.index)">删除此媒体库</button></div>
        </section>

        <section v-else-if="view==='records'" class="view-stack">
          <div class="records-board"><div class="records-head"><span>时间</span><span>条目</span><span>媒体库</span><span>更新字段</span><span>状态</span></div><div class="record-list"><article v-for="record in records" :key="record.id" class="record-item"><div class="record-time">{{record.recorded_at}}</div><div class="record-main"><div class="record-title-row"><span class="record-type" :class="record.item_type==='小说'?'novel':''">{{record.item_type}}</span><h3>{{record.item_title}}</h3></div></div><div class="record-library"><strong>{{record.library_name || '未指定媒体库'}}</strong><small v-if="record.library_id">{{record.library_id}}</small></div><div class="record-fields"><span v-for="field in record.metadata_fields" :key="field">{{metadataText({metadata_fields:[field]})}}</span></div><div class="record-status">{{record.status==='success'?'已完成':'失败'}}</div></article><div v-if="!records.length" class="record-empty">暂无刮削记录</div></div></div>
        </section>

        <section v-else class="view-stack">
          <div class="toolbar"><div></div><div class="toolbar-actions"><button class="secondary" @click="backupConfig" title="下载配置备份">⇩ 备份</button><label class="secondary file-button" title="从备份文件还原">⇧ 还原<input type="file" accept="application/json,.json" @change="restoreConfig"></label><button class="primary" @click="save">保存设置</button></div></div>
          <div class="settings-grid">
            <section class="setting-card"><h3>Komga 媒体服务</h3>
              <div class="server-form"><div class="server-form-title">添加 Komga 服务器</div><div class="server-form-grid"><label>自定义名称<input v-model.trim="serverDraft.name" placeholder="例如：家庭 Komga"></label><label>Komga 地址<input v-model.trim="serverDraft.base_url" placeholder="http://komga:25600"></label></div><div class="auth-tabs"><button type="button" :class="{active:serverDraft.auth_mode==='password'}" @click="serverDraft.auth_mode='password';serverDraft.api_key=''">账号密码</button><button type="button" :class="{active:serverDraft.auth_mode==='key'}" @click="serverDraft.auth_mode='key';serverDraft.email='';serverDraft.password=''">API 密钥</button></div><div class="server-form-grid" v-if="serverDraft.auth_mode==='password'"><label>账号<input v-model.trim="serverDraft.email" type="email"></label><label>密码<input v-model="serverDraft.password" type="password"></label></div><label v-else>API 密钥<input v-model.trim="serverDraft.api_key" type="password"></label><button type="button" class="primary full" @click="addServer">＋ 添加服务器</button></div>
              <div class="server-list-title"><span>已配置服务器</span><small>{{config.KOMGA_SERVERS.length}} 个</small></div>
              <div v-for="(server,index) in config.KOMGA_SERVERS" :key="server.id" class="server-entry">
                <div class="server-entry-head"><div><strong>{{server.name || `Komga ${index+1}`}}</strong><small>{{server.base_url}}</small></div><div class="server-entry-actions"><button type="button" class="secondary compact" @click="openServerEditor(server)">编辑</button><button type="button" class="icon-button" @click="removeServer(index)" title="删除连接">×</button></div></div>
                <div class="server-summary"><span>{{server.auth_mode==='key'?'API 密钥':'账号密码'}}</span><span>可直接修改下方信息</span></div>
                <div class="server-edit-fields">
                <label>自定义名称<input v-model.trim="server.name" placeholder="例如：家庭 Komga"></label>
                <label>Komga 地址<input v-model.trim="server.base_url" placeholder="http://komga:25600"></label>
                <div class="auth-tabs"><button type="button" :class="{active:server.auth_mode==='password'}" @click="server.auth_mode='password';server.api_key=''">账号密码</button><button type="button" :class="{active:server.auth_mode==='key'}" @click="server.auth_mode='key';server.email='';server.password=''">API 密钥</button></div>
                <template v-if="server.auth_mode==='password'"><label>登录邮箱<input v-model.trim="server.email" type="email"></label><label>登录密码<div class="secret-input"><input v-model="server.password" type="password"><button type="button" class="eye-button" @click="$event.target.previousElementSibling.type=$event.target.previousElementSibling.type==='password'?'text':'password'"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div></label></template>
                <label v-else>API 密钥<div class="secret-input"><input v-model.trim="server.api_key" type="password"><button type="button" class="eye-button" @click="$event.target.previousElementSibling.type=$event.target.previousElementSibling.type==='password'?'text':'password'"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div></label>
                </div>
              </div>
              <div v-if="!config.KOMGA_SERVERS.length" class="empty-inline">请添加至少一个 Komga 连接</div>
              <label><span class="label-row"><span>Bangumi 访问密钥</span><a href="https://next.bgm.tv/demo/access-token" target="_blank" rel="noopener noreferrer">创建令牌 ↗</a></span><div class="secret-input"><input v-model.trim="config.BANGUMI_ACCESS_TOKEN" :type="showBangumiToken?'text':'password'" placeholder="可选，用于 NSFW 条目" autocomplete="off"><button type="button" class="eye-button" @click="showBangumiToken=!showBangumiToken" aria-label="显示或隐藏 Bangumi 密钥"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div></label>
              <button type="button" class="secondary full" @click="loadLibraries">测试连接并读取媒体库</button>
              <div class="legacy-fields">
              <label>Komga 地址<input v-model.trim="config.KOMGA_BASE_URL" placeholder="http://komga:25600"></label>
              <div class="auth-tabs"><button :class="{active:komgaAuthMode==='password'}" @click="komgaAuthMode='password'">账号密码</button><button :class="{active:komgaAuthMode==='key'}" @click="komgaAuthMode='key'">API 密钥</button></div>
              <template v-if="komgaAuthMode==='password'"><label>Komga 登录邮箱<input v-model.trim="config.KOMGA_EMAIL" type="email" autocomplete="username"></label><label>Komga 登录密码<div class="secret-input"><input v-model="config.KOMGA_EMAIL_PASSWORD" :type="showKomgaPassword?'text':'password'" autocomplete="current-password"><button type="button" class="eye-button" @click="showKomgaPassword=!showKomgaPassword" :aria-label="showKomgaPassword?'隐藏 Komga 密码':'显示 Komga 密码'" :title="showKomgaPassword?'隐藏密码':'显示密码'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div></label></template>
              <label v-else>Komga API 密钥<div class="secret-input"><input v-model.trim="config.KOMGA_API_KEY" :type="showKomgaApiKey?'text':'password'" autocomplete="off"><button type="button" class="eye-button" @click="showKomgaApiKey=!showKomgaApiKey" :aria-label="showKomgaApiKey?'隐藏 Komga API 密钥':'显示 Komga API 密钥'" :title="showKomgaApiKey?'隐藏密钥':'显示密钥'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div></label>
              <label><span class="label-row"><span>Bangumi 访问密钥</span><a href="https://next.bgm.tv/demo/access-token" target="_blank" rel="noopener noreferrer">创建令牌 ↗</a></span><div class="secret-input"><input v-model.trim="config.BANGUMI_ACCESS_TOKEN" :type="showBangumiToken?'text':'password'" placeholder="可选，用于 NSFW 条目" autocomplete="off"><button type="button" class="eye-button" @click="showBangumiToken=!showBangumiToken" :aria-label="showBangumiToken?'隐藏 Bangumi 密钥':'显示 Bangumi 密钥'" :title="showBangumiToken?'隐藏密钥':'显示密钥'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div></label>
              <button class="secondary full" @click="loadLibraries">测试连接并读取媒体库</button>
              </div>
            </section>
            <section class="setting-card"><h3>服务策略</h3><label>运行模式<select v-model="config.BANGUMI_KOMGA_SERVICE_TYPE"><option value="poll">轮询增量</option><option value="sse">SSE 实时</option><option value="once">手动运行</option></select></label><label>轮询间隔（秒）<input v-model.number="config.BANGUMI_KOMGA_SERVICE_POLL_INTERVAL" type="number" min="5"></label><label>全量刷新周期（轮询次数）<input v-model.number="config.BANGUMI_KOMGA_SERVICE_POLL_REFRESH_ALL_METADATA_INTERVAL" type="number" min="1"></label><div class="account-box"><div><strong>后台账号安全</strong><small>当前账号：{{credentialHint}}</small></div><button class="secondary" @click="openCredentialModal">修改账号密码</button></div></section>
          </div>
        </section>
        <p v-if="message" class="toast" :class="{error:messageError}">{{message}}</p>
      </main>
    </template>

    <div v-if="showCredentialModal" class="modal-backdrop" @click.self="showCredentialModal=false"><form class="modal" @submit.prevent="requestCredentialSave"><button type="button" class="modal-close" @click="showCredentialModal=false">×</button><h2>后台账号</h2><label>账号<input v-model.trim="credentialForm.username" autocomplete="username"></label><label>密码<input v-model="credentialForm.password" type="password" autocomplete="new-password"></label><div class="modal-actions"><button type="button" class="secondary" @click="showCredentialModal=false">取消</button><button class="primary" type="submit">确定</button></div></form></div>
    <div v-if="editingCard" class="modal-backdrop" @click.self="closeCardSettings"><form class="modal card-settings-modal" @submit.prevent="closeCardSettings"><button type="button" class="modal-close" @click="closeCardSettings">×</button><p class="kicker">SCRAPE CARD</p><h2>配置媒体库</h2><p>选择连接后才能读取该连接下的媒体库。</p><label>Komga 连接<select v-model="editingCard.serverId" @change="changeCardServer(editingCard)"><option value="">先选择 Komga 连接</option><option v-for="server in config.KOMGA_SERVERS" :key="server.id" :value="server.id">{{server.name}}</option></select></label><label>Komga 媒体库<select v-model="editingCard.id" :disabled="!editingCard.serverId" @change="syncCardName(editingCard)"><option value="">{{editingCard.serverId ? '选择媒体库' : '请先选择 Komga 连接'}}</option><option v-for="lib in libraries" :key="lib.id" :value="lib.id">{{lib.name}} · {{lib.id}}</option></select></label><label class="modal-check"><input type="checkbox" v-model="editingCard.isNovel"><span>仅匹配小说</span></label><div class="modal-section-title">缺失字段重新刮削</div><div class="modal-rules"><label v-for="field in fieldOptions" :key="field.value"><input type="checkbox" :value="field.value" v-model="editingCard.rules"><span>{{field.label}}</span></label></div><div class="modal-actions"><button type="button" class="secondary" @click="closeCardSettings">取消</button><button class="primary" type="submit">确定</button></div></form></div>
    <div v-if="showCredentialConfirm" class="modal-backdrop" @click.self="showCredentialConfirm=false"><div class="modal confirm-modal"><p class="kicker">CONFIRM CHANGE</p><h2>确认保存新账号密码？</h2><p>保存后当前登录会话仍保持有效，但下次登录需要使用新凭据。</p><div class="modal-actions"><button class="secondary" @click="showCredentialConfirm=false">返回修改</button><button class="primary" @click="confirmCredentialSave">确定保存</button></div></div></div>
    <div v-if="editingServer" class="modal-backdrop" @click.self="editingServer=null"><form class="modal" @submit.prevent="saveServerEdit"><button type="button" class="modal-close" @click="editingServer=null">×</button><h2>编辑 Komga 服务器</h2><label>自定义名称<input v-model.trim="editingServer.name"></label><label>Komga 地址<input v-model.trim="editingServer.base_url"></label><div class="auth-tabs"><button type="button" :class="{active:editingServer.auth_mode==='password'}" @click="editingServer.auth_mode='password';editingServer.api_key=''">账号密码</button><button type="button" :class="{active:editingServer.auth_mode==='key'}" @click="editingServer.auth_mode='key';editingServer.email='';editingServer.password=''">API 密钥</button></div><template v-if="editingServer.auth_mode==='password'"><label>账号<input v-model.trim="editingServer.email" type="email"></label><label>密码<input v-model="editingServer.password" type="password"></label></template><label v-else>API 密钥<input v-model.trim="editingServer.api_key" type="password"></label><div class="modal-actions"><button type="button" class="secondary" @click="editingServer=null">取消</button><button class="primary" type="submit">保存修改</button></div></form></div>
  </div>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script><script src="config.js"></script>
</body>
</html>
