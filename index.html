<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BangumiKomga · 控制台</title>
  <link rel="icon" type="image/png" href="logo-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="overrides.css">
</head>
<body>
  <div id="app" v-cloak>
    <section v-if="!authenticated" class="login-screen">
      <div class="login-orbit orbit-a"></div><div class="login-orbit orbit-b"></div>
      <form class="login-card" @submit.prevent="login">
        <h1>BangumiKomga</h1><p>管理媒体库刮削与运行策略</p>
        <label>账号<input v-model.trim="loginForm.username" autocomplete="username" autofocus></label>
        <label>密码<input v-model="loginForm.password" type="password" autocomplete="current-password"></label>
        <button class="primary login-button" type="submit">进入后台 <span>→</span></button>
      </form>
    </section>

    <template v-else>
      <aside class="sidebar" :class="{collapsed:sidebarCollapsed}">
        <div class="brand"><img class="brand-mark" src="logo-icon.png" alt="BangumiKomga"><span class="brand-name">BangumiKomga</span></div>
        <button class="collapse-btn" @click="sidebarCollapsed=!sidebarCollapsed" :aria-label="sidebarCollapsed?'展开侧栏':'收起侧栏'"><span aria-hidden="true"></span></button>
        <nav class="nav"><button v-for="item in navItems" :key="item.id" class="nav-item" :class="{active:view===item.id}" @click="view=item.id"><span class="nav-icon" :class="`icon-${item.id}`"><i></i></span><span class="nav-label">{{item.label}}</span></button></nav>
        <div class="sidebar-foot"><span class="dot"></span><span class="nav-label">服务在线</span><button class="sidebar-logout" @click="logout" title="退出登录" aria-label="退出登录">↪</button></div>
      </aside>

      <main class="main" :class="{expanded:sidebarCollapsed}" @click="closeContextMenu">
        <header class="page-head hero-head"><div><p class="kicker">BANGUMI KOMGA</p><h1>{{currentNav.title}}</h1><p class="subtitle">{{currentNav.subtitle}}</p></div><div v-if="view==='scrape'" class="hero-controls"><div class="hero-actions"><button class="secondary hero-action" @click="save">保存卡片</button><button class="primary hero-action" @click="addCard">＋ 添加媒体库</button></div></div><div v-else-if="view==='records'" class="records-hero-controls"><div class="record-stats compact"><div><strong>{{recordStats.total}}</strong><span>记录</span></div><div><strong>{{recordStats.today}}</strong><span>今日</span></div><div class="success"><strong>{{recordStats.success}}</strong><span>成功</span></div><div class="error"><strong>{{recordStats.error}}</strong><span>失败</span></div></div><label class="record-search"><span></span><input v-model.trim="recordSearch" placeholder="搜索书名、媒体库或 Komga 服务"></label></div></header>

        <section v-if="view==='scrape'" class="view-stack">
          <div class="library-grid" @click="closeContextMenu">
            <article v-for="(card,index) in cards" :key="card.uid" class="library-card" :class="{dragging:dragIndex===index}" draggable="true" :style="{'--card-hue':card.hue}" @click="openCardSettings(card)" @dragstart="dragStart(index,$event)" @dragend="dragIndex=null" @dragover.prevent @drop="dropCard(index)" @contextmenu.prevent="openCardMenu(index,$event)">
              <div class="cover-collage" :class="{'has-covers':card.covers.some(cover => !cover.failed)}" aria-hidden="true"><template v-for="(cover,coverIndex) in card.covers" :key="cover.id"><img v-if="!cover.failed" :src="cover.url" :style="{'--cover-index':coverIndex}" loading="lazy" @error="coverError(cover)"></template></div><div class="card-content"><p class="card-label">{{cardServerName(card)}}</p><h3>{{card.name||'选择媒体库'}}</h3><p class="card-meta">{{card.isNovel?'小说媒体库':'漫画媒体库'}}<span v-if="card.covers.length"> · {{card.covers.length}} 本预览</span></p></div>
            </article>
            <button v-if="!cards.length" class="empty-card" @click="addCard"><span>＋</span><strong>添加第一个媒体库</strong><small>从 Komga 读取可用库</small></button>
          </div>
          <div v-if="contextMenu.visible" class="context-menu" :style="{left:contextMenu.x+'px',top:contextMenu.y+'px'}" @click.stop><button @click="refreshCardPreview(contextMenu.index)">刷新封面拼贴</button><button :disabled="status.running" @click="refresh(false);closeContextMenu()">增量刮削</button><button :disabled="status.running" @click="refresh(true);closeContextMenu()">全量刮削</button><button class="danger" @click="deleteCard(contextMenu.index)">删除此媒体库</button></div>
        </section>

        <section v-else-if="view==='records'" class="view-stack">
          <div class="records-board"><div class="records-head"><span>漫画&amp;小说</span><button type="button" class="time-sort" @click="toggleRecordSort">时间 <span>{{recordSortNewest?'↓':'↑'}}</span></button><span>Komga 服务</span><span>媒体库</span><span>操作</span><span>状态</span></div><div class="record-list"><article v-for="record in sortedRecords" :key="record.id" class="record-item"><div class="record-main"><div class="record-title-row"><span class="record-type" :class="record.item_type==='小说'?'novel':''">{{record.item_type}}</span><h3>{{record.item_title}}</h3></div></div><div class="record-time">{{formatRecordTime(record.recorded_at)}}</div><div class="record-service"><img src="komga-favicon.ico" alt=""><span>{{record.server_name || '默认 Komga 服务'}}</span></div><div class="record-library"><strong>{{record.library_name || '未指定媒体库'}}</strong></div><div class="record-fields">{{metadataText(record) || '未更新字段'}}</div><div class="record-status" :class="record.status">{{record.status==='success'?'已完成':'失败'}}</div></article><div v-if="!sortedRecords.length" class="record-empty">暂无匹配的刮削记录</div></div></div>
        </section>

        <section v-else class="view-stack">

          <div class="settings-grid settings-layout">
            <section class="setting-card strategy-card"><h3>基本设置</h3><label>运行模式<select v-model="config.BANGUMI_KOMGA_SERVICE_TYPE" @change="save"><option value="poll">轮询增量</option><option value="sse">SSE 实时</option><option value="once">手动运行</option></select></label><label>轮询间隔（秒）<input v-model.number="config.BANGUMI_KOMGA_SERVICE_POLL_INTERVAL" type="number" min="5" @change="save"></label><label>全量刷新周期（轮询次数）<input v-model.number="config.BANGUMI_KOMGA_SERVICE_POLL_REFRESH_ALL_METADATA_INTERVAL" type="number" min="1" @change="save"></label><label>记录保留（天）<input v-model.number="config.RECORD_RETENTION_DAYS" type="number" min="1" max="365" @change="save"></label><small class="settings-note">默认 30 天，最大 365 天，过期记录自动删除。</small></section>
            <section class="setting-card account-card"><h3>登录账号</h3><label>账号<input v-model.trim="credentialForm.username" autocomplete="username"></label><label>密码<input v-model="credentialForm.password" type="password" autocomplete="new-password" placeholder="输入新密码"></label><button class="primary full" @click="requestCredentialSave">保存账号</button></section>
            <section class="setting-card komga-settings-card"><h3>Komga 媒体服务</h3><div class="server-form"><div class="server-form-grid"><label>自定义名称<input v-model.trim="serverDraft.name" placeholder="例如：家庭 Komga"></label><label>Komga 地址<input v-model.trim="serverDraft.base_url" placeholder="http://komga:25600"></label></div><div class="auth-tabs"><button type="button" :class="{active:serverDraft.auth_mode==='password'}" @click="serverDraft.auth_mode='password';serverDraft.api_key=''">账号密码</button><button type="button" :class="{active:serverDraft.auth_mode==='key'}" @click="serverDraft.auth_mode='key';serverDraft.email='';serverDraft.password=''">API 密钥</button></div><div class="server-form-grid" v-if="serverDraft.auth_mode==='password'"><label>账号<input v-model.trim="serverDraft.email" type="email"></label><label>密码<div class="secret-input"><input v-model="serverDraft.password" :type="showServerDraftSecret?'text':'password'"><button type="button" class="eye-button" @click="showServerDraftSecret=!showServerDraftSecret" aria-label="显示或隐藏 Komga 密码"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div></label></div><label v-else>API 密钥<div class="secret-input"><input v-model.trim="serverDraft.api_key" :type="showServerDraftSecret?'text':'password'"><button type="button" class="eye-button" @click="showServerDraftSecret=!showServerDraftSecret" aria-label="显示或隐藏 Komga API 密钥"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div></label><button type="button" class="primary full" @click="addServer">＋ 添加服务</button></div><div class="server-list-title"><span>已配置 Komga 服务</span><small>{{config.KOMGA_SERVERS.length}} 个</small></div><div class="server-card-grid"><article v-for="(server,index) in config.KOMGA_SERVERS" :key="server.id" class="server-entry compact-server" @click="testServer(server)"><img class="server-icon" src="komga-favicon.ico" alt="Komga"><div class="server-entry-head"><div><strong>{{server.name || `Komga ${index+1}`}}</strong><small>{{server.base_url}}</small></div></div><div class="server-summary"><span>{{server.auth_mode==='key'?'API 密钥':'账号密码'}}</span></div><div class="server-entry-actions"><button type="button" class="secondary compact" @click.stop="openServerEditor(server)">编辑</button><button type="button" class="danger-secondary compact" @click.stop="removeServer(index)">删除</button></div></article></div><div v-if="!config.KOMGA_SERVERS.length" class="empty-inline">请添加至少一个 Komga 服务</div></section>
            <section class="setting-card ai-card"><h3>AI 配置</h3><label>OpenAI URL<input v-model.trim="config.OPENAI_BASE_URL" placeholder="https://api.openai.com/v1"></label><label>API 密钥<div class="secret-input"><input v-model.trim="config.OPENAI_API_KEY" :type="showOpenAiKey?'text':'password'" autocomplete="off"><button type="button" class="eye-button" @click="showOpenAiKey=!showOpenAiKey" aria-label="显示或隐藏 OpenAI API 密钥"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div></label><label>模型<input v-model.trim="config.OPENAI_MODEL" placeholder="例如：gpt-4o-mini"></label><label class="modal-check"><input type="checkbox" v-model="config.TRANSLATE_SUMMARY_TO_ZH"><span>刮削时将非中文简介翻译为简体中文并覆盖</span></label><button class="primary full" @click="save">保存 AI 配置</button></section>
            <section class="setting-card backup-card"><h3>配置备份</h3><p class="settings-note">备份包含卡片、Komga 服务与集成配置。</p><div class="backup-actions"><button class="secondary backup-button" @click="backupConfig"><span aria-hidden="true">↓</span>备份</button><label class="secondary file-button backup-button"><span aria-hidden="true">↑</span>还原<input type="file" accept="application/json,.json" @change="restoreConfig"></label></div></section>
            <section class="setting-card bangumi-card"><h3>Bangumi 令牌</h3><label><span class="label-row"><span>访问密钥</span><a href="https://next.bgm.tv/demo/access-token" target="_blank" rel="noopener noreferrer">创建令牌 ↗</a></span><div class="secret-input"><input v-model.trim="config.BANGUMI_ACCESS_TOKEN" :type="showBangumiToken?'text':'password'" placeholder="可选，用于 NSFW 条目" autocomplete="off"><button type="button" class="eye-button" @click="showBangumiToken=!showBangumiToken" aria-label="显示或隐藏 Bangumi 密钥"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div></label><button class="secondary full" @click="save">保存令牌</button></section>
          </div>
        </section>
        <p v-if="message" class="toast" :class="{error:messageError}">{{message}}</p>
      </main>
    </template>

    <div v-if="showCredentialModal" class="modal-backdrop" @click.self="showCredentialModal=false"><form class="modal" @submit.prevent="requestCredentialSave"><button type="button" class="modal-close" @click="showCredentialModal=false">×</button><h2>后台账号</h2><label>账号<input v-model.trim="credentialForm.username" autocomplete="username"></label><label>密码<input v-model="credentialForm.password" type="password" autocomplete="new-password"></label><div class="modal-actions"><button type="button" class="secondary" @click="showCredentialModal=false">取消</button><button class="primary" type="submit">确定</button></div></form></div>
    <div v-if="editingCard" class="modal-backdrop" @click.self="closeCardSettings"><form class="modal card-settings-modal" @submit.prevent="closeCardSettings"><button type="button" class="modal-close" @click="closeCardSettings">×</button><p class="kicker">SCRAPE CARD</p><h2>配置媒体库</h2><p>选择 Komga 服务后读取对应媒体库。</p><div class="card-setting-grid"><label>Komga 服务<select v-model="editingCard.serverId" @change="changeCardServer(editingCard)"><option value="">先选择 Komga 服务</option><option v-for="server in config.KOMGA_SERVERS" :key="server.id" :value="server.id">{{server.name}}</option></select></label><label>媒体库<select v-model="editingCard.id" :disabled="!editingCard.serverId" @change="syncCardName(editingCard)"><option value="">{{editingCard.serverId ? '选择媒体库' : '请先选择 Komga 服务'}}</option><option v-for="lib in libraries" :key="lib.id" :value="lib.id">{{lib.name}} · {{lib.id}}</option></select></label></div><label class="modal-check"><input type="checkbox" v-model="editingCard.isNovel"><span>仅匹配小说</span></label><div class="modal-section-title">缺失元数据</div><div class="modal-rules metadata-options"><button v-for="field in requiredFieldOptions" :key="field.value" type="button" class="meta-option" :class="{selected:editingCard.rules.includes(field.value)}" @click="toggleCardField(editingCard,'rules',field.value)">{{field.label}}</button></div><div class="modal-section-title">元数据覆盖</div><div class="modal-rules metadata-options"><button v-for="field in overwriteFieldOptions" :key="'overwrite-'+field.value" type="button" class="meta-option" :class="{selected:editingCard.overwriteFields.includes(field.value)}" @click="toggleCardField(editingCard,'overwriteFields',field.value)">{{field.label}}</button></div><div class="modal-actions"><button type="button" class="secondary" @click="closeCardSettings">取消</button><button class="primary" type="submit">确定</button></div></form></div>
    <div v-if="showCredentialConfirm" class="modal-backdrop" @click.self="showCredentialConfirm=false"><div class="modal confirm-modal"><p class="kicker">CONFIRM CHANGE</p><h2>确认保存新账号密码？</h2><p>保存后当前登录会话仍保持有效，但下次登录需要使用新凭据。</p><div class="modal-actions"><button class="secondary" @click="showCredentialConfirm=false">返回修改</button><button class="primary" @click="confirmCredentialSave">确定保存</button></div></div></div>
    <div v-if="editingServer" class="modal-backdrop" @click.self="editingServer=null"><form class="modal" @submit.prevent="saveServerEdit"><button type="button" class="modal-close" @click="editingServer=null">×</button><h2>编辑 Komga 服务</h2><label>自定义名称<input v-model.trim="editingServer.name"></label><label>Komga 地址<input v-model.trim="editingServer.base_url"></label><div class="auth-tabs"><button type="button" :class="{active:editingServer.auth_mode==='password'}" @click="editingServer.auth_mode='password';editingServer.api_key=''">账号密码</button><button type="button" :class="{active:editingServer.auth_mode==='key'}" @click="editingServer.auth_mode='key';editingServer.email='';editingServer.password=''">API 密钥</button></div><template v-if="editingServer.auth_mode==='password'"><label>账号<input v-model.trim="editingServer.email" type="email"></label><label>密码<input v-model="editingServer.password" type="password"></label></template><label v-else>API 密钥<input v-model.trim="editingServer.api_key" type="password"></label><div class="modal-actions"><button type="button" class="secondary" @click="editingServer=null">取消</button><button class="primary" type="submit">保存修改</button></div></form></div>
  </div>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script><script src="config.js"></script>
</body>
</html>
